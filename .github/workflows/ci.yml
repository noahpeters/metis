name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: metis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify

  deploy-production:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_AUDIENCE: ${{ vars.CLOUDFLARE_ACCESS_AUDIENCE }}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate production deployment configuration
        run: node scripts/validate-production-deployment.mjs
      - name: Apply D1 migrations
        run: npm run db:migrate:production
      - name: Deploy control-plane Worker
        run: npm run deploy:production
      - name: Deploy administration UI Worker
        run: >-
          npm run deploy:ui:production --
          --var ENVIRONMENT:production
          --var LOCAL_AUTH_ENABLED:false
          --var CLOUDFLARE_ACCESS_AUDIENCE:$CLOUDFLARE_ACCESS_AUDIENCE
          --var CLOUDFLARE_ACCESS_TEAM_DOMAIN:$CLOUDFLARE_ACCESS_TEAM_DOMAIN
