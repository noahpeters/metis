name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: metis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify rendered administration UI
        run: npm run test:ui:visual
      - name: Verify D1-to-UI round trips
        run: npm run test:full-stack
      - name: Upload administration UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metis-administration-ui
          path: output/playwright/metis-pacing.png
          if-no-files-found: error
      - name: Upload full-stack diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metis-full-stack-diagnostics
          path: output/full-stack/
          if-no-files-found: warn

  terraform-plan:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - name: Terraform format
        run: terraform -chdir=infra/production fmt -check
      - name: Initialize Terraform
        run: terraform -chdir=infra/production init
      - name: Discover existing Access application
        run: node infra/production/import-existing-access.mjs
      - name: Validate infrastructure
        run: terraform -chdir=infra/production validate
      - name: Read-only production plan
        run: terraform -chdir=infra/production plan -out=/tmp/production.tfplan
      - name: Record plan
        run: |
          echo "### Terraform production plan" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=infra/production show -no-color /tmp/production.tfplan | tail -n 1 >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    if: github.event_name == 'push'
    needs: terraform-plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.0
      - run: terraform -chdir=infra/production init
      - name: Discover existing Access application
        run: node infra/production/import-existing-access.mjs
      - name: Plan exact merge SHA
        run: terraform -chdir=infra/production plan -out=/tmp/production.tfplan
      - name: Apply reviewed infrastructure
        run: terraform -chdir=infra/production apply -auto-approve /tmp/production.tfplan
      - name: Record apply
        run: |
          echo "### Terraform production apply" >> "$GITHUB_STEP_SUMMARY"
          echo "Applied exact merge SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Infrastructure applied from the checked-in production configuration." >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    if: github.event_name == 'push'
    needs: [verify, terraform-apply]
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npm run db:migrate:production
      - name: Deploy control-plane Worker
        run: npm run deploy:production | tee /tmp/control-plane-deploy.log
      - name: Deploy administration UI Worker
        run: >-
          npm run deploy:ui:production --
          --var ENVIRONMENT:production
          --var LOCAL_AUTH_ENABLED:false
          | tee /tmp/ui-deploy.log
      - name: Verify public endpoints
        run: |
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 15 https://metis-control-plane.gr4gwzrfq2.workers.dev/health >/dev/null
          status=$(curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 10 --max-time 15 --output /dev/null --write-out '%{http_code}' https://metis.from-trees.com/)
          test "$status" = 302 || test "$status" = 403
      - name: Record deployment evidence
        if: always()
        run: |
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Exact merge SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          sed -n '/Version ID:/p' /tmp/control-plane-deploy.log /tmp/ui-deploy.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo "Health and unauthenticated Access boundary smoke checks completed." >> "$GITHUB_STEP_SUMMARY"
