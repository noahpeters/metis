name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: metis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Detect UI changes
        id: ui
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA="HEAD^"
          fi
          if git diff --quiet "$BASE_SHA" HEAD -- ui-assets src/ui test/ui playwright.config.mjs wrangler.ui.jsonc; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium
        if: steps.ui.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - name: Verify rendered UI
        if: steps.ui.outputs.changed == 'true'
        run: npm run test:ui
      - name: Upload Playwright report and screenshots
        if: always() && steps.ui.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ACCESS_AUDIENCE: ${{ vars.CLOUDFLARE_ACCESS_AUDIENCE }}
      CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ vars.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npm run db:migrate:production
      - name: Deploy control-plane Worker
        run: npm run deploy:production
      - name: Deploy administration UI Worker
        run: >-
          npm run deploy:ui:production --
          --var ENVIRONMENT:production
          --var LOCAL_AUTH_ENABLED:false
          --var CLOUDFLARE_ACCESS_AUDIENCE:$CLOUDFLARE_ACCESS_AUDIENCE
          --var CLOUDFLARE_ACCESS_TEAM_DOMAIN:$CLOUDFLARE_ACCESS_TEAM_DOMAIN
