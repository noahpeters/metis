name: Metis engineering task
description: Define work for a target repository before marking it ready
title: ""
labels: []
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should be true when this work is complete?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and evidence
      description: Include relevant behavior, links, records, screenshots, or constraints.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions already made
      description: Record selected approaches and rejected alternatives with reasons.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Out of scope and safety boundaries
  - type: checkboxes
    id: readiness
    attributes:
      label: Readiness
      options:
        - label: The issue is not executable until a human adds `metis:ready`.
          required: true
